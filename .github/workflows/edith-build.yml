name: EDITH APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ZIP dosyasini ac
        run: unzip -q EDITH_GitHub_Hazir.zip -d project

      - name: El modelini indir
        run: |
          mkdir -p project/app/src/main/assets
          curl -L --fail -o project/app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: APK olustur
        working-directory: project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK kaydet
        uses: actions/upload-artifact@v4
        with:
          name: EDITH-APK
          path: project/app/build/outputs/apk/release/app-release.apk
